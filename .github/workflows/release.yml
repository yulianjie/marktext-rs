name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'macos-arm64', os: 'macos-14', target: 'aarch64-apple-darwin' }
          - { name: 'macos-x64',   os: 'macos-13', target: 'x86_64-apple-darwin' }
          - { name: 'linux-x64',   os: 'ubuntu-22.04', target: 'x86_64-unknown-linux-gnu' }
          - { name: 'windows-x64', os: 'windows-latest', target: 'x86_64-pc-windows-msvc' }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Frontend build (type check + bundle)
        run: npm run build

      - name: Tauri build
        run: npm run tauri:build -- --target ${{ matrix.platform.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: marktext-${{ matrix.platform.name }}
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/**/*
          if-no-files-found: warn
