name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build / publish (e.g. v0.1.0)'
        required: true

# tauri-action needs write access to create the release and upload assets
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: 'macos-arm64', os: 'macos-14',       target: 'aarch64-apple-darwin'        }
          - { name: 'macos-x64',   os: 'macos-13',       target: 'x86_64-apple-darwin'         }
          - { name: 'linux-x64',   os: 'ubuntu-22.04',   target: 'x86_64-unknown-linux-gnu'    }
          - { name: 'windows-x64', os: 'windows-latest', target: 'x86_64-pc-windows-msvc'      }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing / notarization secrets are optional. Builds still succeed
          # unsigned if these repository secrets are not set.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tag chosen automatically from the pushed git tag, or from the
          # manual workflow_dispatch input.
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'MarkText ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install MarkText for your platform.'
          # Publish immediately on tag push (no manual review step).
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.platform.target }}
